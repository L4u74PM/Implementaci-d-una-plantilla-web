<section id="historia" class="py-16 px-6 max-w-4xl mx-auto">
  <h2 class="text-3xl font-bold text-white text-center mb-12">
    Historia Completa y Cronología
  </h2>

  <div class="space-y-12 text-zinc-300 text-sm leading-relaxed">
    @for (event of historyEvents; track event.title) {
      <article class="border-l-2 border-red-600 pl-5">
        <span class="text-xs uppercase tracking-wider text-red-500 font-semibold">
          {{ event.year }}
        </span>
        <h3 class="text-xl font-bold text-white mt-1">
          {{ event.title }}
        </h3>
        <p class="mt-2 text-zinc-400">
          {{ event.description }}
        </p>
        <div class="mt-3">
          <a [href]="'#' + event.gameId" class="text-xs text-red-500 hover:text-red-400 font-medium">
            Ver juego: {{ event.gameName }} 
          </a>
        </div>
      </article>
    }
  </div>
</section>
